[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certwatch"
version = "1.0.0"
description = "TLS and certificate configuration auditor with its own DER parser - reports expiry, issuer, SANs, key size, negotiable protocol versions and weak cipher suites, with zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kkcyber2" }]
keywords = ["tls", "ssl", "certificate", "security", "audit", "x509", "der"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
certwatch = "certwatch.cli:main"

[tool.setuptools]
packages = ["certwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
